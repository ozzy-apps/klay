[package]
name = "klay"
version = "0.39.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ozzy-apps/klay"

[dependencies]
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", features = ["winit", "x11", "wayland"] }
egui-winit = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
wgpu = "30.0"
winit = "0.30"
glam = { version = "0.34", features = ["bytemuck"] }
rayon = "1.12"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
env_logger = "0.11"
log = "0.4"
rfd = "0.17.2"
# Send to Strata (3D Print): only with `--features strata`.
strata-bridge = { path = "crates/strata-bridge", optional = true }

[features]
# The direct Klay -> Strata bridge (3D Print > Strata). Off by default: release packages
# and plain clones build without it.
strata = ["dep:strata-bridge"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = 1

# Pen pressure, which winit does not report: on X11 through XInput2 (XTest only for
# `--selftest-pressure`), on Wayland through the tablet protocol on winit's own connection
# (winit already builds all of these; `client_system` is what lets us share its wl_display).
[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
x11rb = { version = "0.13", features = ["xinput", "xtest"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client"] }
