[package]
name = "klay"
version = "0.18.0"
edition = "2024"
repository = "https://github.com/ozzy-apps/klay"

[dependencies]
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", features = ["winit", "x11", "wayland"] }
egui-winit = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
wgpu = "30.0"
winit = "0.30"
glam = { version = "0.34", features = ["bytemuck"] }
rayon = "1.12"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
env_logger = "0.11"
log = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = 1

# Pen pressure on X11 through XInput2, which winit does not report (winit already builds it);
# XTest only for `--selftest-pressure`.
[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
x11rb = { version = "0.13", features = ["xinput", "xtest"] }
