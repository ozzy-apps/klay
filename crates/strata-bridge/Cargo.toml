[package]
name = "strata-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CPU-only Klay to Strata geometry package and local delivery protocol"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
